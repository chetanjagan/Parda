name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app (TypeScript only; libraries come from a CDN, models from Hugging Face)
        working-directory: web
        run: |
          npx --yes -p typescript@5 tsc -p tsconfig.json
          mkdir -p ../_site/public ../_site/vendor/ort
          cp index.html app.css sw.js ../_site/
          # ONNX Runtime on Parda's own site: multi-core needs its worker files from the same address
          mkdir -p /tmp/ort && cd /tmp/ort && npm init -y >/dev/null && npm install --no-audit --no-fund onnxruntime-web@1.20.1
          cp node_modules/onnxruntime-web/dist/ort*.mjs node_modules/onnxruntime-web/dist/*.wasm "$GITHUB_WORKSPACE/_site/vendor/ort/"
          cd "$GITHUB_WORKSPACE/web"
          ls -la ../_site/vendor/ort
          cp -r build ../_site/build
          cp -r public/tokenizer ../_site/public/tokenizer
          ls -R ../_site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
