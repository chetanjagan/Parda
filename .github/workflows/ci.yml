name: ci

on:
  push:
  pull_request:

jobs:
  web-core:
    name: web core = Python pipeline (golden parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (retried; package downloads sometimes time out)
        working-directory: web
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund && exit 0
            echo "npm install failed (attempt $i), retrying in 30 s"; sleep 30
          done
          exit 1
      - name: Core + GLiNER + YOLO + EasyOCR (real tokenizer and real networks) must reproduce every Python answer
        working-directory: web
        env:
          REQUIRE_TOKENIZER: "1"
          REQUIRE_YOLO: "1"
          REQUIRE_EASYOCR: "1"
        run: npm test

  goldens:
    name: goldens still match the Python pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pillow rapidfuzz
      - name: Recompute the Python answers from the stored inputs
        run: python tools/make_goldens.py --check
